# 生产环境配置（密钥类全部走环境变量，fail-fast）
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

logging:
  level:
    com.club.agent: info

# S2：生产环境关闭 API 文档（匿名可看完整 API 面）
springdoc:
  api-docs:
    enabled: false
knife4j:
  enable: false

# S5：prod 覆盖为无默认值（缺失时 Java 侧 warn 不带头；部署收紧项，见部署手册）
ai:
  draft:
    internal-secret: ${AI_DRAFT_INTERNAL_SECRET:}
