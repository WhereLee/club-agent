spring:
  application:
    name: club-agent
  profiles:
    active: dev
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8093

# 健康检查端点开放
management:
  endpoints:
    web:
      exposure:
        include: health,info

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: assign_id                      # 主键：雪花算法
      logic-delete-field: deleted             # 逻辑删除
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# ---------- API 文档（knife4j） ----------
springdoc:
  api-docs:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn

# ---------- 业务配置 ----------
jwt:
  secret: ${JWT_SECRET}
  expire-minutes: ${JWT_EXPIRE_MINUTES:1440}   # 24h

captcha:
  enabled: ${CAPTCHA_ENABLED:true}                    # 开关：false 时登录跳过验证码（开发/自动化测试）
  expire-minutes: 5                            # 验证码有效期

login:
  fail-max-count: ${LOGIN_FAIL_MAX:5}          # 连续失败 N 次锁定
  lock-minutes: ${LOGIN_LOCK_MINUTES:15}       # 锁定时长

storage:
  mode: ${STORAGE_MODE:local}                  # local=本地磁盘 / cos=腾讯云 COS

cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:}
  bucket: ${COS_BUCKET:}
  domain: ${COS_DOMAIN:}                       # 自定义域名（空则用 COS 默认域名）

upload:
  local-dir: ${LOCAL_UPLOAD_DIR:./uploads}     # local 模式存储目录
  max-size: ${UPLOAD_MAX_SIZE:5242880}         # 5MB
  allowed-types: jpg,jpeg,png,gif,webp

# ---------- 概念起草 AI 助手（Python agent-draft 服务，LangGraph 对话 Agent） ----------
ai:
  draft:
    enabled: ${AI_DRAFT_ENABLED:true}                 # 总开关：false 时 AI 接口返回 404
    base-url: ${AI_DRAFT_BASE_URL:http://127.0.0.1:8094}
    timeout-seconds: ${AI_DRAFT_TIMEOUT_SECONDS:120}   # 调 Python 超时：MiMo 一轮 ReAct 可能 40-60s，必须放宽
    skill-dir: ${SKILL_DIR:../skills}                   # D4：SKILL.md 落盘目录（相对 java 运行目录，部署用环境变量覆盖）
    checkpoint-ttl-days: ${CHECKPOINT_TTL_DAYS:30}      # A1：终态概念（通过/作废）N 天后清理 checkpoint 三表，防 PostgresSaver 膨胀

  # Java 端单次线性 AI（块 H）：Spring AI 直连 Xiaomi MiMo（OpenAI 兼容协议），
  # 与 Python 侧流转型 LangGraph Agent 形成双端范式；key 走 .env 注入
  llm:
    base-url: ${LLM_BASE_URL:https://api.xiaomimimo.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:mimo-v2.5}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}

# 预设老师账号（模拟旧系统存量数据；生产部署用环境变量覆盖强密码）
preset:
  teacher:
    usernames: ${PRESET_TEACHER_USERNAMES:teacher1,teacher2}
    password: ${PRESET_TEACHER_PASSWORD:teacher123456}
    email-domain: ${PRESET_TEACHER_EMAIL_DOMAIN:club.local}
