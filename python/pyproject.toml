[project]
name = "agent-draft"
version = "0.1.0"
description = "社团管理 Agent 概念阶段起草助手（LangGraph 对话 Agent）"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3,<2",
    "langchain-openai>=1.4,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",  # 2.x 依赖 langgraph-checkpoint<3，与 langgraph 1.2.x 的 checkpoint 4.x 冲突
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
